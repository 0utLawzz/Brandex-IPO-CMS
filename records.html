<!DOCTYPE html>
<html lang="en" class="theme-neobrutalism">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Record View — Brandex CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F0E8D0;
      --bg-alt: #E8DFC7;
      --bg2: #0C0C0C;
      --panel: #FAF6EE;
      --black: #0C0C0C;
      --accent: #C94A00;
      --accent2: #0D9970;
      --accent3: #D4A800;
      --shadow: 5px 5px 0 #0C0C0C;
      --shadow-sm: 3px 3px 0 #0C0C0C;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', Arial, sans-serif;
      background: var(--bg);
      color: var(--black);
      min-height: 100vh;
      line-height: 1.5;
      text-transform: uppercase;
    }
    .navbar {
      background: var(--bg2);
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid var(--black);
    }
    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 1px;
      color: #FAF6EE;
    }
    .logo-text span { color: #C9A227; }
    .nav-right {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: #888;
      letter-spacing: 1px;
    }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 14px 50px;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem;
      letter-spacing: 1px;
    }
    .back-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 1px;
      padding: 9px 14px;
      background: var(--panel);
      border: 2.5px solid var(--black);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      text-decoration: none;
      color: var(--black);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .back-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #0C0C0C;
    }
    .btn-theme {
      background: var(--accent3);
    }
    .card {
      background: var(--panel);
      border: 3px solid var(--black);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 18px;
      margin-bottom: 18px;
    }
    .section-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      color: var(--accent);
      margin-bottom: 14px;
      padding-bottom: 7px;
      border-bottom: 2px solid var(--black);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: '';
      width: 9px; height: 9px;
      background: var(--accent);
      border: 2px solid var(--black);
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
    }
    th, td {
      border: 2px solid var(--black);
      padding: 10px 12px;
      text-align: left;
    }
    th {
      background: var(--bg2);
      color: #FAF6EE;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    tr:hover {
      background: var(--bg-alt);
    }
    .status-done { background: #d4f5e9; }
    .status-error { background: #fde8e4; }
    .status-pending { background: #fff8d6; }
    .status-onit { background: #e8f4fd; }
    .status-start { background: #f0f0f0; }
    .loading {
      text-align: center;
      padding: 40px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--accent);
    }
    .error {
      text-align: center;
      padding: 40px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--accent);
      background: #fde8e4;
      border: 2px solid var(--black);
      border-radius: var(--radius);
    }
    .empty {
      text-align: center;
      padding: 40px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: #666;
    }
    @media (max-width: 768px) {
      .page-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .page-header h1 {
        width: 100%;
      }
      .page-header > div {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo-text">BRANDEX <span>LAW</span> ASSOCIATES</div>
    <div class="nav-right">RECORD VIEW v1.1</div>
  </nav>

  <div class="page">
    <div class="page-header">
      <h1>Record View</h1>
      <div style="display:flex; gap:12px;">
        <a class="back-btn btn-theme" href="trademark-application.html">← Back to Form</a>
        <a class="back-btn" href="index.html">Back to CMS</a>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Trademark Application Records</div>
      <div id="recordsContainer">
        <div class="loading">Loading records...</div>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUMRVcdasDxGIaaPKbSzhEVbkKyMyYLNv4-NQ8pyGJEjWOukRPzS3Pt5Da6_CdNmP33Q/exec";

    async function loadRecords() {
      const container = document.getElementById('recordsContainer');
      
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getRecords' }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        
        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error('Invalid response from server');
        }

        if (data.ok && data.records && data.records.length > 0) {
          displayRecords(data.records);
        } else {
          container.innerHTML = '<div class="empty">No records found</div>';
        }
      } catch (error) {
        container.innerHTML = `<div class="error">Error loading records: ${error.message}</div>`;
      }
    }

    function displayRecords(records) {
      const container = document.getElementById('recordsContainer');
      
      let tableHTML = `
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Mark Name</th>
                <th>TM No</th>
                <th>Class</th>
                <th>Applicant</th>
                <th>Trading As</th>
                <th>Year</th>
                <th>Consultant</th>
                <th>Fallback</th>
                <th>Status</th>
                <th>Filing</th>
              </tr>
            </thead>
            <tbody>
      `;

      records.forEach(record => {
        const statusClass = getStatusClass(record.status);
        tableHTML += `
          <tr class="${statusClass}">
            <td>${record.date || '-'}</td>
            <td>${record.folder || '-'}</td>
            <td>${record.tm || '-'}</td>
            <td>${record.classNo || '-'}</td>
            <td>${record.appName || '-'}</td>
            <td>${record.appTrade || '-'}</td>
            <td>${record.year || '-'}</td>
            <td>${record.conName || '-'}</td>
            <td>${record.noImg || '-'}</td>
            <td>${record.status || '-'}</td>
            <td>${record.filingProcess || '-'}</td>
          </tr>
        `;
      });

      tableHTML += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = tableHTML;
    }

    function getStatusClass(status) {
      if (!status) return '';
      const statusLower = status.toLowerCase();
      if (statusLower.includes('done')) return 'status-done';
      if (statusLower.includes('error')) return 'status-error';
      if (statusLower.includes('pending')) return 'status-pending';
      if (statusLower.includes('on it')) return 'status-onit';
      if (statusLower.includes('start')) return 'status-start';
      return '';
    }

    // Load records on page load
    loadRecords();
  </script>
</body>
</html>
