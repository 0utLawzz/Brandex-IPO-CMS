<!DOCTYPE html>
<html lang="en" class="theme-neobrutalism">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Record View — Brandex CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F0E8D0;
      --bg-alt: #E8DFC7;
      --bg2: #0C0C0C;
      --panel: #FAF6EE;
      --black: #0C0C0C;
      --accent: #C94A00;
      --accent2: #0D9970;
      --accent3: #D4A800;
      --shadow: 5px 5px 0 #0C0C0C;
      --shadow-sm: 3px 3px 0 #0C0C0C;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', Arial, sans-serif;
      background: var(--bg);
      color: var(--black);
      min-height: 100vh;
      line-height: 1.5;
      text-transform: uppercase;
    }
    .navbar {
      background: var(--bg2);
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid var(--black);
    }
    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 1px;
      color: #FAF6EE;
    }
    .logo-text span { color: #C9A227; }
    .nav-right {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: #888;
      letter-spacing: 1px;
    }
    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 14px 50px;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem;
      letter-spacing: 1px;
    }
    .back-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 1px;
      padding: 9px 14px;
      background: var(--panel);
      border: 2.5px solid var(--black);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      text-decoration: none;
      color: var(--black);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .back-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #0C0C0C;
    }
    .btn-theme { background: var(--accent3); }
    .card {
      background: var(--panel);
      border: 3px solid var(--black);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 18px;
      margin-bottom: 18px;
    }
    .section-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      color: var(--accent);
      margin-bottom: 14px;
      padding-bottom: 7px;
      border-bottom: 2px solid var(--black);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: '';
      width: 9px; height: 9px;
      background: var(--accent);
      border: 2px solid var(--black);
    }
    .table-container {
      overflow-x: auto;
      max-height: 75vh;
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
    }
    th, td {
      border: 2px solid var(--black);
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: var(--bg2);
      color: #FAF6EE;
      font-weight: 500;
      letter-spacing: 0.5px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    tr:hover { background: var(--bg-alt); }
    .status-done { background: #d4f5e9; }
    .status-error { background: #fde8e4; }
    .status-pending { background: #fff8d6; }
    .status-onit { background: #e8f4fd; }
    .status-start { background: #f0f0f0; }
    .search-box {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 8px 12px;
      border: 2.5px solid var(--black);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow-sm);
      width: 260px;
      text-transform: none;
    }
    .count-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      background: var(--accent3);
      border: 2px solid var(--black);
      padding: 4px 10px;
      border-radius: 4px;
      margin-left: 10px;
    }
    .loading, .error, .empty {
      text-align: center;
      padding: 40px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
    }
    .error { color: var(--accent); background: #fde8e4; border: 2px solid var(--black); border-radius: var(--radius); }
    @media (max-width: 768px) {
      .page-header { flex-direction: column; align-items: flex-start; }
      .search-box { width: 100%; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo-text">BRANDEX <span>LAW</span> ASSOCIATES</div>
    <div class="nav-right">RECORD VIEW v1.3 — NEW SHEET DATA</div>
  </nav>

  <div class="page">
    <div class="page-header">
      <h1>Record View <span class="count-badge" id="countBadge">...</span></h1>
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <input type="text" class="search-box" id="searchInput" placeholder="Search mark / TM / applicant..." oninput="filterTable()">
        <a class="back-btn btn-theme" href="trademark-application.html">← Back to Form</a>
        <a class="back-btn" href="index.html">Back to CMS</a>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Trademark Application Records (New Sheet — 672 entries)</div>
      <div id="recordsContainer">
        <div class="loading">Loading records from new sheet data...</div>
      </div>
    </div>
  </div>

  <script>
    let ALL_RECORDS = [];

    function getStatusClass(status) {
      if (!status) return '';
      const s = status.toLowerCase();
      if (s.includes('done')) return 'status-done';
      if (s.includes('error') || s.includes('review') || s.includes('reject')) return 'status-error';
      if (s.includes('pending')) return 'status-pending';
      if (s.includes('on it')) return 'status-onit';
      if (s.includes('start')) return 'status-start';
      return '';
    }

    function renderTable(records) {
      const container = document.getElementById('recordsContainer');
      const badge = document.getElementById('countBadge');
      badge.textContent = records.length;

      if (records.length === 0) {
        container.innerHTML = '<div class="empty">No matching records</div>';
        return;
      }

      let html = `<div class="table-container"><table>
        <thead><tr>
          <th>Date</th><th>Mark Name</th><th>TM No</th><th>Class</th>
          <th>Applicant</th><th>Trading As</th><th>Year</th>
          <th>Consultant</th><th>Fallback</th><th>Status</th><th>Filing</th>
        </tr></thead><tbody>`;

      records.forEach(r => {
        const statusClass = getStatusClass(r.status) || getStatusClass(r.filingProcess);
        html += `<tr class="${statusClass}">
          <td>${r.date || '-'}</td>
          <td>${r.folder || '-'}</td>
          <td>${r.tm || '-'}</td>
          <td>${r.classNo || '-'}</td>
          <td>${r.appName || '-'}</td>
          <td>${r.appTrade || '-'}</td>
          <td>${r.year || '-'}</td>
          <td>${r.conName || '-'}</td>
          <td>${r.noImg || '-'}</td>
          <td>${r.status || '-'}</td>
          <td>${r.filingProcess || '-'}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) { renderTable(ALL_RECORDS); return; }
      const filtered = ALL_RECORDS.filter(r =>
        (r.folder || '').toLowerCase().includes(q) ||
        (r.tm || '').toLowerCase().includes(q) ||
        (r.appName || '').toLowerCase().includes(q) ||
        (r.appTrade || '').toLowerCase().includes(q) ||
        (r.conName || '').toLowerCase().includes(q) ||
        (r.classNo || '').toLowerCase().includes(q)
      );
      renderTable(filtered);
    }

    async function loadRecords() {
      const container = document.getElementById('recordsContainer');
      try {
        const resp = await fetch('records-data.json');
        if (!resp.ok) throw new Error('Failed to load records-data.json');
        ALL_RECORDS = await resp.json();
        renderTable(ALL_RECORDS);
      } catch (err) {
        container.innerHTML = `<div class="error">Error loading data: ${err.message}<br>Make sure records-data.json is present.</div>`;
      }
    }

    loadRecords();
  </script>
</body>
</html>
